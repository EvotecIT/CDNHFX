<VirtualHost *:80>
    ServerName cdnhfx.evotec.xyz
    DocumentRoot /var/www/cdnhfx/site/current
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://cdnhfx.evotec.xyz%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog ${APACHE_LOG_DIR}/cdnhfx-error.log
    CustomLog ${APACHE_LOG_DIR}/cdnhfx-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName cdnhfx.evotec.xyz
    DocumentRoot /var/www/cdnhfx/site/current
    SSLEngine On
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/cdnhfx.evotec.xyz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cdnhfx.evotec.xyz/privkey.pem

    <Directory /var/www/cdnhfx/site/current>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    DirectoryIndex index.html
    Header always set Access-Control-Allow-Origin "*"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "public, max-age=300, must-revalidate" "expr=%{REQUEST_STATUS} < 400"
    Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} >= 400"
    <LocationMatch "^/v/[0-9]+\.[0-9]+\.[0-9]+/">
        Header always set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} < 400"
    </LocationMatch>
    <Location "/_powerforge/deployment.json">
        Header always set Cache-Control "no-store"
    </Location>
    ErrorLog ${APACHE_LOG_DIR}/cdnhfx-error.log
    CustomLog ${APACHE_LOG_DIR}/cdnhfx-access.log combined
</VirtualHost>
</IfModule>
